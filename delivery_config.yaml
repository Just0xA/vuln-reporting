# delivery_config.yaml
# Edit this file to configure delivery groups, schedules, and recipients.
# No code changes are required — the scheduler reads this file directly.
# See CLAUDE.md and RUNBOOK.MD for full documentation and examples.
#
# Supported frequencies: weekly | monthly | on_demand
# Run  python run_all.py --dry-run  after editing to validate before the next scheduled run.
#   reports:
#     - vuln_export
#     - board_summary
#     - management_summary
#     - ops_remediation

groups:
  - name: "Test Pull"
    description: "First of the month full executive package"
    schedule:
      frequency: on_demand
    reports:
      - board_summary
    filters: {}
    email:
      subject: "Monthly Vulnerability Management Report"
      recipients:
        - monroe.justin@gmail.com
      reply_to: monroe.justin@gmail.com

  - name: "Test Pull — Analyst Off"
    description: "Phase 4 CONFIG-03 opt-out exerciser. Same scope as 'Test Pull' but with analyst_detail: false — should produce PDF + standard Excel + email panels but NO analyst companion workbook. Test recipient uses RFC 6761 reserved domain per D-04-08."
    schedule:
      frequency: on_demand
    reports:
      - board_summary
    filters: {}
    analyst_detail: false
    email:
      subject: "[Phase 4 test] Board Summary — analyst_detail=false"
      recipients:
        - reports-test@example.invalid
      reply_to: reports-test@example.invalid

  - name: "Test Pull — Zero Match"
    description: "Phase 4 empty-data exerciser. Tag filter selects zero scoped assets so all four board modules return empty ModuleData and render the no-data path (gray 'No Data' RAG cells, em-dash headlines, 'No data in scope.' driver narrative). tag_category 'Application' is a real category in the operator's Tenable tenant; tag_value 'DoesNotExist' is a literal sentinel known to be unused per D-04-04 (revised 2026-05-07)."
    schedule:
      frequency: on_demand
    reports:
      - board_summary
    filters:
      tag_category: "Application"
      tag_value: "DoesNotExist"
    email:
      subject: "[Phase 4 test] Board Summary — zero-match scope"
      recipients:
        - reports-test@example.invalid
      reply_to: reports-test@example.invalid
